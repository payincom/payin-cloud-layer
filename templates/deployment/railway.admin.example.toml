# Example-only Railway Admin template for a hosted PayIn Cloud overlay.
# Build arguments shown here are public-client placeholders only.
# Put sensitive values in the host secret manager and keep them out of git.

[build]
builder = "DOCKERFILE"
dockerfilePath = "templates/deployment/Dockerfile.admin.example"
watchPaths = [
  "apps/admin/**",
  "templates/deployment/Dockerfile.admin.example",
  "templates/deployment/railway.admin.example.toml",
]

[build.buildArgs]
VITE_API_URL = "${{PUBLIC_API_BASE_URL}}"
VITE_PAYMENT_LINK_PUBLIC_URL = "${{PUBLIC_PAYMENT_LINK_BASE_URL}}"
VITE_SUPABASE_URL = "${{PUBLIC_SUPABASE_URL}}"
VITE_SUPABASE_ANON_KEY = "${{PUBLIC_SUPABASE_ANON_KEY}}"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Public build args may be baked into static files. Never pass server secrets here.
