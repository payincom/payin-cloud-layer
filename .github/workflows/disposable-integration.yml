name: Disposable Integration

on:
  workflow_dispatch:

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PAYIN_CLOUD_LAYER_INTEGRATION: '1'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payin_cloud_layer_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payin_cloud_layer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-package-lock
      - run: npm run verify
